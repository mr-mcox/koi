# Job Screener Rubric
#
# This file is the source of truth for evaluation criteria. Rubric text is
# sliced verbatim into research prompts and review screens (R4). Git history
# is the change log — no in-file version/revision_note; this isn't a schema
# with multiple versions live at once.
#
# Cross-references: docs/architecture/decisions.md (R4, S2-S8, D7).
# Schema: `src/screen/baml_src/extract.baml` (`Assertion`) and `src/screen/types.py`.
#
# Privacy boundary: this file is public. Compensation baseline, résumé, and
# contact details live in untracked config, not here.
# ---------------------------------------------------------------------------
# Scored dimensions — weighted rollup (D6, D7)
# ---------------------------------------------------------------------------
#
# Fit vocabulary: Poor = −1, Mixed = 0, Strong = +1 (D2, D3).
# Only Medium/High confidence assertions count; Low-confidence assertions
# are excluded and logged to the hypothesis queue.
#
# Per-dimension distribution: mean n·m/(n+1), variance ⅓/(n+1).
# Unexamined dimensions are Uniform(−1, +1) — same mean as confirmed Mixed,
# far wider spread. They are not dropped from the denominator (D5, D6).
#
# `location`, `internal_culture`, and `extractive_business` carry no special
# scoring path — a rank-based queue only needs a sufficiently-weighted additive
# dimension to sink a bad case out of top K; there is no separate multiplicative
# "constraint" mechanism to maintain. Their weights are unmeasured placeholders,
# same status as `top_k` (open-questions.md OQ9) — expect them to move once real
# ranking runs.
#
# Ranking sorts on P(rank ≤ top_k) by Monte Carlo (S9), not on the mean (D10).
# top_k is a config value, not set here.

dimensions:
  - slug: stretch
    label: "Stretch & Frontier"
    weight: 3
    definition: >
      Distance from the edge of the operator's current ability — novelty
      relative to what has already been done, not novelty in the abstract.
      Industry-level novelty matters only insofar as it puts the work near
      that edge. An inverted U: Poor at both tails (D15). More novelty is
      not monotonically better.

      Strong requires stretch AND a foundation to stretch from. This is what
      separates the middle of the U from its right tail: growth opportunity
      resting on something solid. A role where the operator would be the
      foundation has real novelty but nothing to climb.

      Ability-indexed only, not shape-indexed — whether the operator would be
      stretched, independent of whether the work involves originating structure
      or mastering a fixed one (that's `schematic`). A protocol-mastery
      role can be stretch-Strong while schematic-Poor, and the reverse also
      holds.

      Anchor companies: Company A (greenfield, built it, plateaued — the
      left plateau); Company B (still had runway at departure — the shape
      to look for).
    fit_anchors:
      Poor: >
        Either tail. Undershoot: senior-level scope; 'write code you won't
        regret in six months'; a pattern with a strong track record on the
        résumé already. Overshoot: no realistic path to being qualified.
      Mixed: >
        Something genuinely novel, but not the sweet spot. Novelty without
        scaffolding (first-technical-hire roles). Also lands here when
        organisational pace limits how often the edge actually gets
        touched — large slow enterprises are Mixed or lower even when the
        nominal problem is hard.
      Strong: >
        Visible growth opportunity on a solid foundation. Most genuinely
        staff-level roles land here. Also roles where the engineering bar
        itself is the stretch, independent of domain novelty.
    look_for: >
      Requisition level and scope (staff vs. senior is the strongest single
      signal); stack and domain familiarity checked against résumé; whether
      an established engineering bar exists to climb; organisational pace
      and shipping cadence; years-of-experience requirements in unfamiliar
      domains (overshoot signal).
    notes: >
      Expect overrides here (D16). Treat proposed ratings on this dimension
      as the least trustworthy in the rubric.

  - slug: schematic
    label: "Schematic"
    weight: 3
    definition: >
      Whether the role's central work is originating the shape of a solution —
      decomposition, mechanism design, structure that didn't exist before —
      versus achieving depth within a structure, protocol, or spec someone
      else already fixed.
      structure is still being decided, as distinct from construction
      documents or construction administration, when a design is executed
      and detailed to spec.

      Independent of `stretch` — shape of the work, not distance from
      the operator's ability. Expected to correlate in practice
      (architecturally ambiguous roles tend to also be unfamiliar) but not
      redundant; the divergent cases are the ones worth catching.
    fit_anchors:
      Poor: >
        The ceiling is depth within a fixed frame: protocol or spec
        mastery, becoming the internal expert on an existing product,
        implementing to a design set elsewhere.
      Mixed: >
        Some room to shape implementation details, but the overall frame
        (architecture, protocol, product boundary) is set elsewhere.
      Strong: >
        The role's core work is inventing structure: decomposition,
        mechanism design, building the thing that resolves the question —
        whether that shows up as system or bounded-context design, or as
        creative algorithmic/mechanism design outside a structural
        register.
    look_for: >
      Posting language distinguishing "design the approach" from
      "implement to spec"; whether the team owns architecture decisions or
      inherits them from a platform/vendor; interview questions about how
      past ambiguous problems were resolved, asked to originate vs. asked
      to recall.
    notes: >
      Anchors describe the role's shape only, not operator fit — the
      over/underqualified judgment emerges from combining this with `stretch`
      in the rollup, not from baking it into these anchors.

  - slug: trajectory
    label: "Trajectory & Leverage"
    weight: 2
    definition: >
      Two-part: is the company's trajectory actually healthy, AND would the
      operator's specific work be load-bearing to it — not just 'fine, get
      paid, learn something'. Poor trajectory always dominates regardless
      of leverage.
    fit_anchors:
      Poor: >
        Trajectory at risk regardless of individual effort — distress-framed
        cuts, leadership instability, no coherent strategic answer. A sinking
        ship is a sinking ship whether or not the work would matter.
      Mixed: >
        Healthy company, but unclear whether this specific role is the thing
        driving outcomes.
      Strong: >
        Healthy trajectory AND the role is demonstrably load-bearing to a
        stated strategy.
    look_for: >
      Funding recency/stage; headcount direction; layoff framing (strategic
      vs. distress); whether the role sits on a stated strategic critical path.

  - slug: mission
    label: "Mission fit"
    weight: 2
    definition: >
      Does the business win when the customer wins, or by extracting from
      them — plus whether any 'AI-powered' claim is real product leverage
      or investor decoration. Internal culture is NOT part of this dimension;
      that is the separate `internal_culture` dimension below.
    fit_anchors:
      Poor: >
        Wins by extracting from the customer, or AI claims read as decoration.
      Mixed: >
        Ambiguous, or props up a systemic problem rather than disrupting it —
        non-predatory but not clearly value-creating either.
      Strong: >
        Demonstrably wins when the customer wins; AI usage, if any, is
        instrumental.
    look_for: >
      Revenue mechanics; business model description; company statements about
      AI usage; comparison against anchor companies.

  - slug: agentic
    label: "Agentic/AI Engineering Culture"
    weight: 2
    definition: >
      Does engineering actually work with agentic tooling and
      provider-agnostic experimentation, or is 'AI-forward' a Copilot
      license.
    fit_anchors:
      Poor: >
        Copilot-tier autocomplete is the ceiling, or visibly behind.
      Mixed: >
        Individual engineers can use agentic tools; no org-level culture
        or investment around it.
      Strong: >
        Real investment — dedicated tooling, provider-agnostic
        experimentation, discussed as genuine practice.
    look_for: >
      Engineering blog posts on tooling/practice; posting language about
      AI-tooling expectations; whether tooling is single-vendor-locked or
      genuinely experimental.

  - slug: compensation
    label: "Compensation"
    weight: 2
    definition: >
      Would total compensation likely be higher than the operator's
      configured baseline (SCREEN_COMPENSATION_BASELINE)? A likelihood
      judgment, not a flat band comparison — domain coolness handles the
      "would justify a below-baseline offer" case through the weighted
      average, so this dimension asks only whether the evidence points
      above or below baseline.
    fit_anchors:
      Poor: "Evidence points to total compensation below baseline."
      Mixed: "Evidence is mixed, or points to roughly baseline."
      Strong: "Evidence points to total compensation above baseline."
    look_for: >
      Posted range (best signal); Levels.fyi/comparable benchmarks;
      recruiter-stated range.

  - slug: domain
    label: "Domain coolness"
    weight: 1
    definition: >
      Genuine personal fascination with the subject matter itself,
      independent of the business's mission ethics. This is what would
      justify a below-baseline offer without special-case logic anywhere
      else, since the weighted average handles the tradeoff naturally.
    fit_anchors:
      Poor: "Flat, no pull."
      Mixed: "Neutral, no strong pull either direction — most roles land here."
      Strong: "The domain itself excites regardless of mission story."
    look_for: >
      Operator's own reaction to the domain; overlap with known interests
      (creative/music/audio, novel technical domains).

  - slug: location
    label: "Location compatibility"
    weight: 6
    definition: >
      Whether the role's location arrangement is workable and desirable for the
      operator's actual situation. Ordered: remote-first company > remote as
      an option > hybrid or awkward remote > relocation required. Negotiability
      shows up as spread within a Fit band via the ordinary shrinkage math.
    fit_anchors:
      Poor: >
        Relocation required, stated, with no flexibility language; or a
        commute/schedule the operator's situation cannot accommodate.
      Mixed: >
        Remote is offered but the posting is silent on travel or team
        distribution culture; or the company is centrally based and hiring
        this seat remotely as an exception; or hybrid with mandated in-office
        days that create a genuine commute/schedule burden.
      Strong: >
        A genuinely distributed / remote-first company, or a remote role that
        openly acknowledges only occasional travel as the tradeoff.
    look_for: >
      Explicit location/remote policy language; whether the team/company is
      distributed by design or centrally based; travel expectations; whether
      remote hires exist at the level being applied for; metro/commute distance
      from the operator's home base; any relocation assistance or flexibility
      language.

  - slug: internal_culture
    label: "Internal culture"
    weight: 4
    definition: >
      Stack-ranking, extractive-toward-employees dynamics, or leadership
      instability. Distinct from `mission` — this captures how the company
      treats its own people, not its customers or the world.
    fit_anchors:
      Poor: >
        Forced-ranking, punitive layoffs, or leadership whiplash at
        Medium/High confidence — heavy enough that no other dimension's
        strength should be expected to fully offset it.
      Mixed: >
        Negative evidence exists only at Low confidence (logged as a
        hypothesis, not yet discounting), or no strong signal either way.
      Strong: >
        Researched, no negative evidence found — 'nothing bad turned up'
        after genuinely looking, not the default state of nobody checking.
    look_for: >
      Layoff framing and cadence; stated performance-management practices
      (forced ranking, stack ranking); leadership tenure/turnover; employee
      review sites, weighted for recency and corroboration.

  - slug: extractive_business
    label: "Extractive core business model"
    weight: 4
    definition: >
      Extreme or obvious cases where the core business model extracts value
      from users rather than creating it. Anything less obvious flows into
      `mission`, which is built for nuanced middle ground; this dimension is
      for clear-cut anchor cases only.
    fit_anchors:
      Poor: >
        A clear-cut anchor case of value extraction at Medium/High
        confidence — near-certain, not a borderline call.
      Mixed: >
        Ambiguous, or no clear signal either way after looking.
      Strong: >
        No signal of extraction, having looked — the outcome of looking,
        not the starting state. Reasoning from the company's mission that
        it is generative rather than extractive is what earns this, not
        the absence of evidence.
    look_for: >
      Revenue mechanics; user complaints framed around exploitation
      (dark patterns, addictive design, predatory pricing); comparison
      against anchor cases.

# ---------------------------------------------------------------------------
# Non-scoring targets
# ---------------------------------------------------------------------------
#
# Assertions about these topics are stored and surfaced but never enter the
# scoring rollup. The `non_scoring:` namespace prefix prevents accidental
# confusion with a scoring slug (Wall 3).

non_scoring:
  - slug: "non_scoring:obtainability"
    label: "Obtainability"
    definition: >
      Warm-path access, referral potential, recruiter source, inbound vs.
      outbound. Relevant to urgency and application strategy but never to
      the fit score. Never enters standing (Wall 4).
