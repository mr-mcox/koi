# Scoring dials — operator-owned config, not versioned rubric content.
#
# rubric.yaml owns dimension/constraint definitions and dimension weights (R4: rubric text
# and weights are load-bearing, versioned). This file owns the Monte Carlo mechanics;
# provenance-rung widths are dials expected to move with use, not decisions worth a version
# bump each time they're retuned.
#
# See docs/architecture/open-questions.md OQ1 (provenance-rung widths). Everything below is a
# named placeholder, not a measurement.

# Monte Carlo. `seed` makes a ranking reproducible run-to-run — without it, two openings
# whose P differs by less than sampling noise would swap places between runs.
seed: 20260821
samples: 200000

# Effective sample-weight per provenance rung. Each scoring/constraint target's distribution
# is Uniform(mean - half_width, mean + half_width) with
#     n = sum(provenance_weight[a.provenance] for a in that target's assertions)
#     mean = n * sample_mean / (n + 1)
#     half_width = 1 / sqrt(n + 1)
# — the same shrinkage the prototype used for counted (Medium/High) evidence, generalized so
# provenance sets the effective weight instead of a binary confidence gate (S8, and E3's
# raw-gesture-kept/snap-scores split, in docs/architecture/decisions.md).
#
# `unexamined` = 0.0: an assertion whose own provenance is literally "unexamined" contributes
# nothing, equivalent to being absent. A *target* reads as unexamined (Uniform(-1, +1) prior)
# when the assertions attached to it sum to zero effective weight — not from a special-cased
# branch, just n = 0 in the formula above.
#
# `model_proposed` = 1.0 is chosen so today's seed data (all real assertions collected so
# far are model_proposed) scores identically to the pre-provenance prototype formula, where
# every counted entry had implicit weight 1. `precedent_matched` and `ratified` are first-cut,
# uncalibrated placeholders — narrower than model_proposed, never zero (OQ1).
provenance_weight:
  unexamined: 0.0
  model_proposed: 1.0
  precedent_matched: 3.0
  ratified: 8.0

# Attention allocation. The queue's competitive cutoff: the operator applies to
# roughly the top K openings each week. K≈5 today and expected to grow with
# capacity — unmeasured placeholder.
top_k: 5

# Research targeting. Per-target
# action cap while a target is sticky: once the planner picks a primary target, it
# stays on that target for up to this many actions before the ranking is allowed to
# switch. Prevents mid-chain thrash when a fetch on one target incidentally yields an
# assertion about another target. Unmeasured placeholder, same status as top_k above.
research_target_action_cap: 3

# Pairwise comparisons. `beta` scales the
# Thurstone/probit comparison likelihood: how decisively a win separates two latent
# values. Unmeasured placeholder, same status as top_k above — later fit from the
# calibration log.
comparison_beta: 0.5

# Compare picker jitter. Log-normal multiplicative noise (score *= exp(N(0, sigma)))
# applied to each (pair, dimension) candidate's score before argmax, so one comparison
# result can't sink a pair's priority permanently. 0.3 is the smallest value that, in
# simulation against a live 33-opening pool, got every scored dimension picked at least
# once over 60 rounds without visibly loosening focus on the top-K boundary — same
# unmeasured-placeholder status as top_k, expected to move with use.
comparison_jitter_sigma: 0.3
