# Scoring dials — operator-owned config, not versioned rubric content.
#
# rubric.yaml owns dimension/constraint definitions and dimension weights (R4: rubric text
# and weights are load-bearing, versioned). This file owns the Monte Carlo mechanics: `bar`
# is explicitly called out in rubric.yaml as "a config value, not set here" (rubric.yaml
# line ~137); provenance-rung widths are dials expected to move with use, not decisions
# worth a version bump each time they're retuned.
#
# See docs/architecture/open-questions.md OQ1 (provenance-rung widths). Everything below is a
# named placeholder, not a measurement.

# The queue sorts on P(overall > bar). `overall` lives in [0, 1].
bar: 0.60

# Monte Carlo. `seed` makes a ranking reproducible run-to-run — without it, two openings
# whose P differs by less than sampling noise would swap places between runs.
seed: 20260821
samples: 200000

# Effective sample-weight per provenance rung. Each scoring/constraint target's distribution
# is Uniform(mean - half_width, mean + half_width) with
#     n = sum(provenance_weight[a.provenance] for a in that target's assertions)
#     mean = n * sample_mean / (n + 1)
#     half_width = 1 / sqrt(n + 1)
# — the same shrinkage the prototype used for counted (Medium/High) evidence, generalized so
# provenance sets the effective weight instead of a binary confidence gate (S8, and E3's
# raw-gesture-kept/snap-scores split, in docs/architecture/decisions.md).
#
# `unexamined` = 0.0: an assertion whose own provenance is literally "unexamined" contributes
# nothing, equivalent to being absent. A *target* reads as unexamined (Uniform(-1, +1) prior)
# when the assertions attached to it sum to zero effective weight — not from a special-cased
# branch, just n = 0 in the formula above.
#
# `model_proposed` = 1.0 is chosen so today's seed data (all real assertions collected so
# far are model_proposed) scores identically to the pre-provenance prototype formula, where
# every counted entry had implicit weight 1. `precedent_matched` and `ratified` are first-cut,
# uncalibrated placeholders — narrower than model_proposed, never zero (OQ1).
provenance_weight:
  unexamined: 0.0
  model_proposed: 1.0
  precedent_matched: 3.0
  ratified: 8.0

# DimensionRuling half-width bounds (review-ux/dimension-ruling bearing). The operator's
# `settledness` (0 = loose opinion, 1 = strongest stated conviction) maps to half_width via
#     half_width = hw_max - settledness * (hw_max - hw_min)
# — rising conviction narrows the distribution but never to a point estimate (hw_min > 0):
# the operator may be noisy even at maximum stated confidence. Unmeasured placeholders,
# same status as bar above.
#
# These bounds also set the pin's implicit weight for dimension-ruling-drift (bearing
# Approach): a pin's half_width is interpreted as the equivalent evidence count
#     n_pin = 1 / half_width^2
# so settledness naturally determines how much pseudo-evidence the operator's pin carries.
# That derivation means a zero-conviction pin (settledness=0, half_width=hw_max=1.0) carries
# the same weight as the ordinary unexamined-target prior, and a maximum-conviction pin
# dominates a single new assertion. No separate weight dial needed.
dimension_ruling:
  hw_max: 1.0
  hw_min: 0.05

# Rating-VOI triage (review-ux/rating-voi-triage bearing). Per-opening cap on how many
# unrated assertion/dimension tasks the focused view surfaces at once — the "switching
# cost" that keeps attention on one opening instead of spreading across a dozen half-rated
# ones. Unmeasured placeholder, same status as bar/bands above.
rating_task_budget: 4

# Attention allocation. The queue's competitive cutoff: the operator applies to
# roughly the top K openings each week. K≈5 today and expected to grow with
# capacity — unmeasured placeholder, same status as bar/rating_task_budget above.
top_k: 5

# Research resumability (research-resumability bearing). Per-opening lifetime cap on
# research turns (one `search` or `fetch` action). Seeded onto every opening at intake;
# existing openings are backfilled to this same value. Manually bumpable per opening —
# no formula from queue position yet, that's the deferred research-pass bandit's job.
# Unmeasured placeholder, same status as bar/top_k above.
research_turns_budget: 5

# Research targeting (research-resumability/research-targeting bearing). Per-target
# action cap while a target is sticky: once the planner picks a primary target, it
# stays on that target for up to this many actions before the ranking is allowed to
# switch. Prevents mid-chain thrash when a fetch on one target incidentally yields an
# assertion about another target. Unmeasured placeholder, same status as bar/top_k above.
research_target_action_cap: 3
