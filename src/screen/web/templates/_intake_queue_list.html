{% for item in items %}
<li class="intake-queue-item intake-queue-status-{{ item.status }}">
  <span class="intake-queue-status">{{ item.status }}</span>
  <span class="intake-queue-url">{{ item.url }}</span>
  {% if item.error %}
  <p class="intake-queue-error">{{ item.error }}</p>
  {% endif %}
  {% if item.status == "failed" %}
  <form class="intake-queue-retry" hx-post="/intake-queue/{{ item.id }}/retry" hx-target="#intake-queue-list" hx-swap="innerHTML">
    <button type="submit">Retry</button>
  </form>
  {% endif %}
</li>
{% else %}
<li class="intake-queue-empty">Nothing queued yet.</li>
{% endfor %}
