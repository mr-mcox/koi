<div id="batch-status"
  {% if status.running %}
    hx-get="/batch-status"
    hx-trigger="every 2s"
    hx-swap="outerHTML"
  {% endif %}>
  {% if error %}
    <p class="batch-error">{{ error }}</p>
  {% endif %}
  {% if status.running %}
    <p class="batch-running">
      Researching
      {% if status.eta_seconds is not none %}
        — about {{ status.eta_seconds | eta_text }} left
      {% endif %}
    </p>
  {% endif %}
</div>
